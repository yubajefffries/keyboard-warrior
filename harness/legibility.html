<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Text Legibility Harness</title>
  <style>
    :root {
      --prompt-fg: #ffffff;
      --prompt-done: #6dc26d;
      --prompt-bg: rgba(10, 10, 12, 0.82);
      --error: #ff5449;
      --prompt-size: 56px;
    }
    * { margin: 0; box-sizing: border-box; }
    body { background: #000; overflow: hidden; font-family: Consolas, monospace; }
    #bg { position: fixed; inset: 0; }
    #prompt {
      position: fixed; left: 50%; bottom: 18%; transform: translateX(-50%);
      background: var(--prompt-bg); border: 1px solid #333; border-radius: 10px;
      padding: 18px 42px; font-size: var(--prompt-size); letter-spacing: 0.12em;
      color: var(--prompt-fg); white-space: pre; z-index: 10; font-family: Consolas, Menlo, monospace;
    }
    #prompt .done { color: var(--prompt-done); }
    #prompt .current { text-decoration: underline; text-underline-offset: 8px; }
    #prompt.error .current { color: var(--error); font-weight: 700; text-decoration: underline wavy; }
    .hc { --prompt-bg: rgba(0,0,0,0.97); --prompt-fg: #ffffff; --prompt-done: #9be79b; }
    #controls {
      position: fixed; top: 12px; left: 12px; z-index: 20; background: rgba(10,10,14,0.9);
      border: 1px solid #333; border-radius: 8px; padding: 12px 16px; color: #cfd2d6; font-size: 13px;
      line-height: 2;
    }
    #controls label { display: block; cursor: pointer; }
    #report { margin-top: 8px; border-top: 1px solid #333; padding-top: 8px; }
    .pass { color: #6dc26d; } .fail { color: #ff5449; }
  </style>
</head>
<body>
  <canvas id="bg"></canvas>
  <div id="prompt"></div>
  <div id="controls">
    <b>Text Legibility Harness (PRD 3.2)</b>
    <label><input type="checkbox" id="fog" checked /> Fog / smoke motion</label>
    <label><input type="checkbox" id="enemyMotion" checked /> Enemy motion (silhouettes)</label>
    <label><input type="checkbox" id="shake" /> Camera shake / recoil on background (prompt must not move)</label>
    <label><input type="checkbox" id="flash" /> Error flash loop (rate-capped, WCAG 2.3.1)</label>
    <label><input type="checkbox" id="hc" /> High Contrast Text mode</label>
    <label>Text size <input type="range" id="size" min="36" max="84" value="56" /></label>
    <div id="report"></div>
  </div>
  <script type="module" src="/src/harness/legibility.ts"></script>
</body>
</html>
