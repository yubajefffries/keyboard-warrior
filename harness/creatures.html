<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Creature Viewer Harness</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22><rect width=%2216%22 height=%2216%22 rx=%223%22 fill=%22%237a1f1a%22/><text x=%228%22 y=%2212%22 font-size=%2210%22 text-anchor=%22middle%22 fill=%22white%22 font-family=%22monospace%22>K</text></svg>" />
  <style>
    * { margin: 0; box-sizing: border-box; }
    body { background: #000; overflow: hidden; font-family: Consolas, monospace; }
    #view { position: fixed; inset: 0; width: 100%; height: 100%; }
    #controls {
      position: fixed; top: 12px; left: 12px; z-index: 20; background: rgba(10,10,14,0.9);
      border: 1px solid #333; border-radius: 8px; padding: 12px 16px; color: #cfd2d6; font-size: 13px;
      line-height: 2; max-width: 340px;
    }
    #controls b { color: #fff; }
    #controls label { display: block; cursor: pointer; }
  </style>
</head>
<body>
  <canvas id="view"></canvas>
  <div id="controls">
    <b>Creature viewer</b> &mdash; standard, crawler, brute<br />
    <label><input type="checkbox" id="active" /> active-target highlight</label>
    <label><input type="checkbox" id="low" /> low intensity (silhouettes)</label>
    <label><input type="checkbox" id="reduce" /> motion reduction</label>
    <label><input type="checkbox" id="walk" checked /> walk animation</label>
    Same materials, lighting mood, and animation code the game uses.
  </div>
  <script type="module" src="/src/harness/creatures.ts"></script>
</body>
</html>
